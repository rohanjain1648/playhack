version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: iitg_sports_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sports_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sports_pass}
      POSTGRES_DB: ${POSTGRES_DB:-iitg_sports}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sports_user -d iitg_sports']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iitg_sports_prod_redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: iitg_sports_prod_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sports_user}:${POSTGRES_PASSWORD:-sports_pass}@postgres:5432/${POSTGRES_DB:-iitg_sports}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod_access_secret_change_me_32char}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_refresh_secret_change_me_32char}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: iitg_sports_prod_client
    restart: always
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  postgres_prod_data:
  redis_prod_data:
